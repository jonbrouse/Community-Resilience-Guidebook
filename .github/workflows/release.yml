name: Release

# Runs on push to main (after PR merge).
# Builds the PDF, deploys the MkDocs site to GitHub Pages,
# tags the release, and attaches the PDF to a GitHub Release.

on:
  push:
    branches: [main]

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  read-version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version via make
        id: version
        run: |
          VERSION=$(make version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists, skipping release creation."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  build-pdf:
    name: Build PDF
    needs: read-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra lmodern

      - name: Build PDF via make
        run: make pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v5
        with:
          name: guidebook-pdf
          path: Community-Resilience-Guidebook.pdf
          retention-days: 90

  build-site:
    name: Build MkDocs site
    needs: [read-version, build-pdf]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site via make
        run: make build

      - name: Download PDF artifact
        uses: actions/download-artifact@v5
        with:
          name: guidebook-pdf
          path: ./

      - name: Bundle PDF into site
        run: make bundle-pdf-into-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    name: Create GitHub Release
    needs: [read-version, build-pdf, deploy-pages]
    if: needs.read-version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download PDF artifact
        uses: actions/download-artifact@v5
        with:
          name: guidebook-pdf
          path: ./

      - name: Extract latest changelog entry
        id: changelog
        run: |
          VERSION=${{ needs.read-version.outputs.version }}
          awk -v ver="## \\[$VERSION\\]" '
            $0 ~ ver {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "Release of version $VERSION." > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](./CHANGELOG.md) for details." >> release_notes.md
          fi

          echo "Release notes:"
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.read-version.outputs.version }}
          name: Version ${{ needs.read-version.outputs.version }}
          body_path: release_notes.md
          files: |
            Community-Resilience-Guidebook.pdf
          draft: false
          prerelease: false
