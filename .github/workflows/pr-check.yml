name: PR Check

# Runs on every pull request to verify the guidebook builds correctly
# without actually publishing anything.

on:
  pull_request:
    branches: [main]

jobs:
  verify-version-bump:
    name: Verify VERSION was bumped
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if guidebook content changed
        id: content_changed
        run: |
          if git diff --name-only origin/main...HEAD | grep -q "docs/index.md"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if VERSION was bumped
        if: steps.content_changed.outputs.changed == 'true'
        run: |
          OLD_VERSION=$(git show origin/main:VERSION | tr -d '[:space:]')
          NEW_VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "Old version: $OLD_VERSION"
          echo "New version: $NEW_VERSION"
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "::error::Guidebook content changed but VERSION was not bumped."
            echo "::error::See CONTRIBUTING.md for the versioning rules."
            exit 1
          fi
          echo "✓ VERSION bumped from $OLD_VERSION to $NEW_VERSION"

  build-pdf:
    name: Build PDF (verification only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-fonts-extra lmodern

      - name: Substitute version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          sed -i "s/{{VERSION}}/$VERSION/g" docs/index.md
          echo "Built for version $VERSION"

      - name: Build PDF
        run: |
          pandoc docs/index.md \
            -o Community-Resilience-Guidebook.pdf \
            --pdf-engine=xelatex \
            --toc \
            --toc-depth=2 \
            -V geometry:margin=1in \
            -V documentclass=article \
            -V fontsize=11pt \
            -V linkcolor=blue \
            -V mainfont="DejaVu Serif" \
            -V sansfont="DejaVu Sans" \
            -V monofont="DejaVu Sans Mono"

      - name: Upload PDF as artifact (PR preview)
        uses: actions/upload-artifact@v4
        with:
          name: guidebook-pdf-preview
          path: Community-Resilience-Guidebook.pdf
          retention-days: 14

  build-site:
    name: Build MkDocs site (verification only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Substitute version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          sed -i "s/{{VERSION}}/$VERSION/g" docs/index.md

      - name: Build site (strict mode)
        run: mkdocs build --strict
